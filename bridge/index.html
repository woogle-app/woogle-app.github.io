<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRIDGE · Hwanghak-dong Seoul</title>
<meta name="description" content="BRIDGE — 33 private studios between Sindang and Dongmyo. Dongmyo flea market 6 min, Emart 3 min. Before-you-fly checklist, directions, local food.">
<meta name="theme-color" content="#F2EDE3">
<meta property="og:title" content="BRIDGE · Seoul">
<meta property="og:description" content="Dongmyo vintage and Emart at your door.">
<meta property="og:image" content="img/h1d.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
 --bg:#F2EDE3;--bg2:#FBF8F2;--surf:#FFFFFF;--line:#E3DACA;--ink:#1C1A17;--mute:#686256;--dim:#978F81;
 --brass:#E2462B;--brass2:#C23A22;--onbrass:#FFFFFF;--yel:#FFD84D;--grn:#1F5C45;
 --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","PingFang SC","Hiragino Sans",sans-serif;
 --disp:"Space Grotesk","Pretendard Variable",-apple-system,sans-serif;
 --r1:18px;--r2:12px;--r3:999px;--w:1120px;--pad:20px;
 --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{scroll-behavior:smooth;scroll-padding-top:130px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--pad)}
/* header */
.hd{position:sticky;top:0;z-index:40;background:rgba(16,18,23,.78);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}
.hd .wrap{display:flex;align-items:center;gap:12px;height:66px}
.logo{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.02em;white-space:nowrap}
.logo small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--mute);letter-spacing:.02em;font-weight:500;margin-top:-3px}
.tabs{border-top:1px solid rgba(255,255,255,.06)}
.tabs .wrap{display:flex;gap:6px;height:auto;padding-top:8px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;height:38px;display:flex;align-items:center;padding:0 15px;border-radius:var(--r3);font-size:15.5px;font-weight:700;color:var(--mute);border:1px solid var(--line);transition:background-color .2s,color .2s}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs a.ci{color:var(--brass);border-color:rgba(215,177,114,.5)}
.lang{margin-left:auto;display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r3);font-size:15px;font-weight:600;color:var(--ink)}
.hd .book{height:42px;padding:0 18px;border-radius:var(--r3);background:var(--brass);color:var(--onbrass);font-weight:800;font-size:16px;display:flex;align-items:center}
/* hero */
.hero{position:relative;padding:14px var(--pad) 0;max-width:var(--w);margin:0 auto}
.frame{position:relative;border-radius:var(--r1);overflow:hidden;aspect-ratio:4/3;background:var(--surf)}
.frame picture{position:absolute;inset:0;opacity:0;transition:opacity .9s var(--ease)}
.frame picture img{width:100%;height:100%;object-fit:cover;transform:scale(1.05);transition:transform 6s linear}
.frame picture.on{opacity:1}
.frame picture.on img{transform:scale(1)}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,18,23,0) 52%,rgba(16,18,23,.5) 72%,rgba(16,18,23,.92) 100%)}
.hcopy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 18px}
.hcopy .loc{text-shadow:0 1px 6px rgba(0,0,0,.6);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brass);font-weight:600;margin-bottom:10px}
.hcopy h1{font-family:var(--disp);font-weight:600;font-size:clamp(28px,7.4vw,52px);line-height:1.04;letter-spacing:-.015em;overflow-wrap:break-word;min-width:0}
.hcopy p{margin-top:10px;color:#DCD5CA;font-size:15.5px;max-width:44ch}
.dots{position:absolute;top:16px;right:16px;z-index:3;display:flex;gap:6px}
.dots button{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.35);transition:background-color .3s}
.dots button.on{background:var(--ink)}
/* action strip */
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:76px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line);font-size:13px;font-weight:600;transition:transform .16s var(--ease),background-color .2s}
.act:active{transform:scale(.97)}
.act.pri{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.act .ic{width:22px;height:22px}
/* sections */
section{padding:64px 0 8px}
.sec-h{margin-bottom:22px}
.sec-h h2{font-family:var(--disp);font-weight:600;font-size:clamp(28px,6.4vw,44px);line-height:1.1;letter-spacing:-.01em;overflow-wrap:break-word}
.sec-h p{color:var(--mute);margin-top:8px;max-width:52ch}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}
/* myeongdong rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px var(--pad) 10px;margin:0 calc(var(--pad)*-1);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.spot{scroll-snap-align:start;position:relative;border-radius:var(--r1);overflow:hidden;aspect-ratio:4/5;background:var(--surf)}
.spot img{width:100%;height:100%;object-fit:cover}
.spot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,11,14,.9))}
.spot .tx{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}
.spot .wk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--onbrass);background:var(--brass);padding:4px 10px;border-radius:var(--r3)}
.spot h3{font-size:21px;font-weight:700;margin-top:10px;line-height:1.25}
.spot p{color:#D8D1C6;font-size:14px;margin-top:4px}
.spot.txt{display:flex;align-items:flex-end;background:linear-gradient(160deg,#252a35,#171a21);border:1px solid var(--line)}
.spot.txt::after{display:none}
.spot.txt .tx{position:static;padding:18px}
/* day plan */
.day{margin-top:26px;border-top:1px solid var(--line)}
.day li{list-style:none;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.day time{font-family:var(--disp);font-size:20px;color:var(--brass);line-height:1.3}
.day b{display:block;font-size:16px}
.day p{color:var(--mute);font-size:14.5px;margin-top:2px}
/* rooms */
.seg{display:inline-flex;padding:4px;border-radius:var(--r3);background:var(--surf);border:1px solid var(--line);margin-bottom:16px}
.seg button{height:36px;padding:0 18px;border-radius:var(--r3);font-size:14px;font-weight:600;color:var(--mute);transition:background-color .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rooms{grid-auto-columns:72%}
.room{scroll-snap-align:start;text-align:left;border-radius:var(--r1);overflow:hidden;background:var(--surf);border:1px solid var(--line);transition:transform .16s var(--ease)}
.room:active{transform:scale(.98)}
.room .ph{aspect-ratio:4/3;overflow:hidden}
.room .ph img{width:100%;height:100%;object-fit:cover}
.room .rt{padding:14px 16px 16px}
.room h3{font-size:17px;font-weight:700}
.room .meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--mute);font-size:13.5px;margin-top:6px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:var(--r3);border:1px solid var(--line);color:var(--mute)}
.tag.win{color:var(--brass);border-color:rgba(215,177,114,.45)}
.amen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:22px;color:var(--mute);font-size:14.5px}
.amen li{list-style:none;display:flex;gap:8px;align-items:center}
.amen .ic{color:var(--brass);width:17px;height:17px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
.sheet.show .bd{opacity:1}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.show .pn{transform:none}
.pn .gal{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pn .gal::-webkit-scrollbar{display:none}
.pn .gal img{scroll-snap-align:start;width:100%;aspect-ratio:4/3;object-fit:cover}
.pn .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(16,18,23,.7);display:grid;place-items:center;z-index:2}
.pn .bd2{padding:18px var(--pad) 0}
.pn h3{font-family:var(--disp);font-size:28px;font-weight:600}
.pn .cnt{font-size:12.5px;color:var(--mute);margin-top:6px}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.spec div{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.spec b{display:block;font-size:17px}
.spec span{font-size:12.5px;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:var(--r2);background:var(--brass);color:var(--onbrass);font-weight:700;font-size:16px;width:100%;transition:transform .16s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
/* pre */
.pre-bar{position:relative;height:38px;border-radius:var(--r3);background:var(--surf);border:1px solid var(--line);overflow:hidden;margin-bottom:14px}
.pre-bar i{position:absolute;inset:0;background:linear-gradient(90deg,var(--brass2),var(--brass));transform-origin:left;transition:transform .5s var(--ease)}
.pre-bar span{position:relative;display:flex;align-items:center;height:100%;padding:0 16px;font-size:13.5px;font-weight:700;mix-blend-mode:difference;color:#fff}
.pre{list-style:none;display:grid;gap:10px}
.pre li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:16px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line);transition:border-color .2s}
.pre li.on{border-color:rgba(215,177,114,.5)}
.pre li.on b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--brass)}
.tick{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--dim);display:grid;place-items:center;color:transparent;transition:background-color .2s,border-color .2s,transform .16s var(--ease)}
.tick:active{transform:scale(.94)}
.pre li.on .tick{background:var(--brass);border-color:var(--brass);color:var(--onbrass)}
.pre b{font-size:16px}
.pre p{color:var(--mute);font-size:14.5px;margin-top:2px}
.lnk{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:14px;font-weight:700;color:var(--brass)}
/* routes */
.routes{display:grid;gap:10px}
.route{padding:18px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line)}
.route .top{display:flex;align-items:center;gap:12px}
.route .top .ic{width:26px;height:26px;color:var(--brass)}
.route h3{font-size:17px;font-weight:700}
.route .sub{font-size:13.5px;color:var(--mute)}
.route .best{margin-left:auto;font-size:12px;font-weight:700;color:var(--onbrass);background:var(--brass);padding:3px 10px;border-radius:var(--r3);white-space:nowrap}
.steps{list-style:none;margin-top:12px;padding-left:12px;border-left:1.5px dashed var(--line)}
.steps li{position:relative;padding:4px 0 4px 14px;color:#D8D1C6;font-size:14.5px}
.steps li::before{content:"";position:absolute;left:-17px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--brass)}
.stns{display:grid;gap:8px;margin-top:22px}
.stn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line)}
.ln{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px}
.stn b{font-size:15.5px}
.stn .m{margin-left:auto;font-size:14px;color:var(--brass);font-weight:700;white-space:nowrap}
.map{margin-top:14px;border-radius:var(--r1);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--surf)}
.map iframe{width:100%;height:100%;border:0;filter:grayscale(.2) contrast(1.05)}
.mapbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.taxi{margin-top:14px;padding:20px;border-radius:var(--r1);background:var(--ink);color:#15161A}
.taxi small{font-size:13px;font-weight:600;color:#6B655C}
.taxi .ko{font-size:24px;font-weight:800;line-height:1.35;margin-top:6px;letter-spacing:-.02em}
.taxi .en{font-size:14px;color:#57524A;margin-top:6px}
.taxi button{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#15161A;border:1px solid #CFC8BC;border-radius:var(--r3);padding:8px 14px}
/* eat */
.tip{display:flex;gap:12px;padding:16px;border-radius:var(--r2);background:linear-gradient(135deg,rgba(215,177,114,.16),rgba(215,177,114,.04));border:1px solid rgba(215,177,114,.35);margin-bottom:14px}
.tip .ic{color:var(--brass);margin-top:2px}
.tip b{display:block}
.tip p{color:#D8D1C6;font-size:14.5px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 15px;border-radius:var(--r3);border:1px solid var(--line);font-size:14px;color:var(--mute);transition:background-color .2s,color .2s}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eats{list-style:none;border-top:1px solid var(--line)}
.eat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--line)}
.eat b{font-size:16px}
.eat p{grid-column:1;color:var(--mute);font-size:14.5px}
.eat .h{grid-column:1;font-size:13px;color:var(--dim)}
.eat a{grid-row:1/4;grid-column:2;align-self:center;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r3);border:1px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap}
.eat .d{color:var(--brass);font-weight:700}
.cis{list-style:none;display:grid;gap:10px}
.cis li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:18px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line)}
.cis .n{width:44px;height:44px;border-radius:50%;background:var(--brass);color:var(--onbrass);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:20px}
.cis b{font-size:17px}.cis p{color:var(--mute);font-size:15px;margin-top:2px}
.gh{font-family:var(--disp);font-size:24px;font-weight:600;margin:28px 0 12px}
.guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gd{padding:16px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line)}
.gd .ic{width:26px;height:26px;color:var(--brass)}
.gd b{display:block;font-size:15.5px;margin-top:8px;line-height:1.35}
.gd p{color:var(--mute);font-size:13.5px;margin-top:4px;line-height:1.5}
.gd.hot{border-color:rgba(215,177,114,.5);background:linear-gradient(160deg,rgba(215,177,114,.14),var(--surf))}
.fee{margin-top:12px;padding:18px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line)}
.fee b{font-size:16px}.fee p{color:var(--mute);font-size:14px;margin-top:4px}
.fee table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.fee td{padding:9px 0;border-top:1px solid var(--line)}.fee td:last-child{text-align:right;color:var(--brass);font-weight:700}
/* info */
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;font-size:17px;font-weight:700;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:10px;height:10px;border-right:1.7px solid var(--mute);border-bottom:1.7px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.acc details[open] summary::after{transform:rotate(-135deg)}
.acc .in{padding:0 0 18px;color:var(--mute);font-size:15px}
.acc .in li{margin-left:18px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kv div{padding:14px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line)}
.kv span{font-size:12.5px;color:var(--mute)}
.kv b{display:block;font-size:20px;color:var(--ink);font-family:var(--disp)}
footer{margin-top:60px;padding:36px 0 calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--mute);font-size:14px}
footer .logo{color:var(--ink);font-size:22px;margin-bottom:12px}
footer .ct{display:grid;gap:6px;margin-bottom:18px}
footer .ct a{display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.cred{font-size:12px;color:var(--dim);line-height:1.5}
.cred a{text-decoration:underline}
@media (min-width:760px){
 :root{--pad:32px}
 .guide{grid-template-columns:repeat(4,minmax(0,1fr))}
 .cis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .frame{aspect-ratio:1920/520}
 .hcopy{padding:40px}
 .rail{grid-auto-columns:calc((100% - 24px)/3);margin:0;padding:2px 0 10px}
 .rooms{grid-auto-columns:calc((100% - 36px)/4)}
 .acts{grid-template-columns:repeat(4,minmax(0,1fr));max-width:640px}
 .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
 .sheet .pn{left:50%;right:auto;width:560px;bottom:auto;top:50%;border-radius:24px;transform:translate(-50%,-46%);opacity:0;transition:transform .3s var(--ease),opacity .25s}
 .sheet.show .pn{transform:translate(-50%,-50%);opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}.rv{opacity:1;transform:none}.frame picture img{transform:none}}
@media (hover:hover) and (pointer:fine){.act:hover{background:#232835}.act.pri:hover{background:#E1BE82}.eat a:hover{border-color:var(--brass)}}

/* ---- BRIDGE overrides ---- */
html:root{--g1:#E2462B;--g2:#FF9F1C}
.hd{background:rgba(242,237,227,.86);border-bottom:1px solid var(--line)}
.tabs{border-top:1px solid var(--line)}
.tabs a{color:var(--mute);border-color:var(--line);background:var(--surf)}
.logo{font-weight:700;letter-spacing:-.02em;font-size:21px}
.sec-h h2,.hcopy2 h1{font-weight:700;letter-spacing:-.035em}
.sec-h h2.h3{font-size:clamp(22px,5vw,30px)}
.frame{aspect-ratio:16/10}
.frame::after{display:none}

function renderPromo(app,L,o){
 const p=PR[app][L],q=s=>document.querySelector(s);
 const mq=q("#mq");if(mq){const row=p.mq.map(x=>`<span>${x}</span><i>✦</i>`).join("");mq.innerHTML=`<div class="mq-t">${row}${row}</div>`;}
 const pf=q("#prf");if(pf)pf.innerHTML=`<p class="eyebrow">${p.prf[0]}</p><div class="nums">${p.prf[1].map(n=>`<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join("")}</div>`;
 const pk=q("#perks");if(pk)pk.innerHTML=`<div class="sec-h rv"><h2>${p.pk[0]}</h2><p>${p.pk[1]}</p></div><ol class="pks">${p.pk[2].map((x,i)=>`<li class="rv"><span class="pn">${String(i+1).padStart(2,"0")}</span><div><b>${x[0]}</b><p>${x[1]}</p></div><em>${x[2]}</em></li>`).join("")}</ol>`;
 const wh=q("#who");if(wh)wh.innerHTML=`<div class="sec-h rv"><h2>${p.who[0]}</h2></div><div class="whos">${p.who[1].map(x=>`<div class="wh rv"><b>${x[0]}</b><p>${x[1]}</p></div>`).join("")}</div>`;
 const fq=q("#faq");if(fq)fq.innerHTML=`<div class="sec-h rv"><h2>${p.faq[0]}</h2></div><div class="acc rv">${p.faq[1].map(x=>`<details><summary>${x[0]}</summary><div class="in"><p>${x[1]}</p></div></details>`).join("")}</div>`;
 const ct=q("#ctaBand");if(ct)ct.innerHTML=`<h2>${p.cta[0]}</h2><p>${p.cta[1]}</p><a class="btn" href="${o.href}" ${o.href.startsWith("http")?'target="_blank" rel="noopener"':""}>${p.cta[2]}</a>`;
 const sb=q("#stickyCta");if(sb){sb.innerHTML=`<span>${p.cta[0]}</span><a href="${o.href}" ${o.href.startsWith("http")?'target="_blank" rel="noopener"':""}>${p.cta[2]}</a>`;
  if(!sb.dataset.bound){sb.dataset.bound=1;const hero=q(".hero");const io=new IntersectionObserver(es=>sb.classList.toggle("show",!es[0].isIntersecting));if(hero)io.observe(hero);}}
}
