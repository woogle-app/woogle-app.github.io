function floorSvg(sel){
  const W=300,fh=22,top=10;
  let s=`<svg viewBox="0 0 ${W} ${top+13*fh+14}" xmlns="http://www.w3.org/2000/svg">`;
  for(let f=12;f>=-1;f--){ if(f===0) continue;
    const i=12-f - (f<0?1:0), y=top+i*fh;
    const lab=f<0?"B1":f+"F", on=sel===f;
    s+=`<g data-f="${f}" style="cursor:pointer"><text x="8" y="${y+15}" font-size="11" fill="var(--mute)">${lab}</text>`;
    if(f>=2){ for(let r=0;r<3;r++){ const x=46+r*82; s+=`<rect x="${x}" y="${y+2}" width="76" height="${fh-4}" rx="4" fill="${on?"var(--teal)":"var(--sand)"}"/><text x="${x+38}" y="${y+15}" font-size="10.5" text-anchor="middle" fill="${on?"#fff":"var(--ink)"}">${f}0${r+1}</text>`;} }
    else if(f===1){ s+=`<rect x="46" y="${y+2}" width="240" height="${fh-4}" rx="4" fill="var(--clay)"/><text x="166" y="${y+15}" font-size="10.5" text-anchor="middle" fill="#fff">LOBBY · KIOSK · SHOP</text>`; }
    else { s+=`<rect x="46" y="${y+2}" width="240" height="${fh-4}" rx="4" fill="none" stroke="var(--line)"/><text x="166" y="${y+15}" font-size="10.5" text-anchor="middle" fill="var(--mute)">B1</text>`; }
    s+=`</g>`;
  }
  return s+`</svg>`;
}

  <rect x="${(80-w)/2+4}" y="12" width="${k===2?22:26}" height="20" rx="2" fill="var(--teal)" opacity=".25"/>
  ${k===2?`<rect x="${(80-w)/2+30}" y="12" width="22" height="20" rx="2" fill="var(--teal)" opacity=".25"/>`:""}
  <rect x="${(80-w)/2+w-16}" y="${8}" width="12" height="18" fill="var(--clay)" opacity=".35"/>

}

function areaMap(){
  const pts=[{lat:CFG.lat,lng:CFG.lng},...STATIONS];
  const minLat=37.5622,maxLat=37.5770,minLng=127.0125,maxLng=127.0260,W=340,H=300;
  const X=l=>((l-minLng)/(maxLng-minLng))*W, Y=l=>H-((l-minLat)/(maxLat-minLat))*H;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:var(--sand)">`;
  // Cheonggyecheon (approx.)
  s+=`<path d="M0 ${Y(37.5712)} C ${X(127.016)} ${Y(37.5709)}, ${X(127.021)} ${Y(37.5712)}, ${W} ${Y(37.5716)}" stroke="#7FB8D6" stroke-width="7" fill="none" opacity=".8"/>`;
  s+=`<text x="8" y="${Y(37.5712)-8}" font-size="10" fill="var(--mute)">Cheonggyecheon 청계천</text>`;
  // walking lines
  STATIONS.forEach(st=>{s+=`<line x1="${X(st.lng)}" y1="${Y(st.lat)}" x2="${X(CFG.lng)}" y2="${Y(CFG.lat)}" stroke="var(--teal2)" stroke-width="2.5" stroke-dasharray="5 5"/>`});
  EAT.forEach(e=>{s+=`<circle cx="${X(e.lng)}" cy="${Y(e.lat)}" r="3.6" fill="var(--clay)" opacity=".85"/>`});
  STATIONS.forEach(st=>{const x=X(st.lng),y=Y(st.lat);s+=`<rect x="${x-7}" y="${y-7}" width="14" height="14" rx="3" fill="#fff" stroke="var(--ink)"/><text x="${x}" y="${y+4}" font-size="9" text-anchor="middle" font-weight="700" fill="var(--ink)">M</text><text x="${x+10}" y="${y+4}" font-size="10.5" font-weight="700" fill="var(--ink)">${st.id==="sindang"?"Sindang 신당":"Dongmyo 동묘앞"}</text>`;
    st.lines.forEach((ln,i)=>{s+=`<circle cx="${x+16+i*14}" cy="${y+14}" r="6" fill="${st.c[i]}"/><text x="${x+16+i*14}" y="${y+17.5}" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="700">${ln}</text>`})});
  const bx=X(CFG.lng),by=Y(CFG.lat);
  s+=`<circle cx="${bx}" cy="${by}" r="13" fill="var(--teal)" stroke="#fff" stroke-width="3"/><text x="${bx}" y="${by+4}" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">B</text><text x="${bx+18}" y="${by+4}" font-size="12" font-weight="700" fill="var(--teal)">BRIDGE</text>`;
  s+=`<text x="${W-8}" y="${H-8}" font-size="9" text-anchor="end" fill="var(--mute)">● food · schematic, not to scale</text></svg>`;
  return s;
}

 {k:/late check.?out|checkout|check.?out|체크아웃|退房|アウト/i, a:{en:"Check-out is by "+CFG.checkout+". Drop your key card in the box by the kiosk. Late check-out is possible on request, subject to availability.",zh:"退房时间为"+CFG.checkout+"前，请将房卡投入自助机旁的回收箱。延迟退房视房态而定。",ja:"チェックアウトは"+CFG.checkout+"まで。カードキーはキオスク横のボックスへ。レイトチェックアウトは空室状況により可能です。",ko:"체크아웃은 "+CFG.checkout+"까지이며 키카드는 키오스크 옆 반납함에 넣어 주세요. 레이트 체크아웃은 객실 상황에 따라 가능합니다."}},
 {k:/check.?in|early|kiosk|passport|체크인|키오스크|여권|入住|护照|チェックイン|パスポート/i, a:{en:"Check-in from "+CFG.checkin+" at the self-service kiosk in the 1F lobby: scan the QR, scan your passport, and get your room number and door code. Early arrival? Leave your bags in the lobby.",zh:"入住时间"+CFG.checkin+"起，在1楼大堂自助机：扫码→扫描护照→获取房号与门锁密码。提前到达可先寄存行李。",ja:"チェックインは"+CFG.checkin+"から、1階ロビーのキオスクでQR→パスポート読み取り→部屋番号と暗証番号を受け取ります。早めの到着時は荷物をお預けください。",ko:"체크인은 "+CFG.checkin+"부터 1층 로비 키오스크에서: QR 스캔 → 여권 스캔 → 객실 번호·도어 비밀번호 발급. 일찍 도착하시면 짐을 먼저 맡겨 주세요."}},
 {k:/laundry|wash|세탁|빨래|洗衣|ランドリー|洗濯/i, a:{en:"Please ask the front desk about laundry. The nearest coin laundries are a few minutes' walk around Sindang.",zh:"洗衣请咨询前台，新堂附近步行几分钟有自助洗衣店。",ja:"ランドリーはフロントにお問い合わせください。新堂周辺に徒歩数分のコインランドリーがあります。",ko:"세탁은 프런트에 문의해 주세요. 신당 주변 도보 몇 분 거리에 코인세탁소가 있습니다."}},
 {k:/breakfast|brunch|아침|조식|早餐|朝/i, a:{en:"Breakfast picks: Dongmyo Restaurant (pasta & brunch from 7 AM), Pal Pal Neoguri Haejang (hot soup from 11 AM), or street food at Seoul Central Market. See the Eat tab for QR maps.",zh:"早餐推荐：东庙洋食堂（7点起早午餐）、八八解酒汤（11点起），或首尔中央市场小吃。详见「美食」页。",ja:"朝食なら：東廟洋食堂（7時〜ブランチ）、パルパルヘジャン（11時〜スープ）、ソウル中央市場の屋台など。「グルメ」タブをご覧ください。",ko:"아침은 동묘양식당(7시~ 브런치), 팔팔너구리해장(11시~ 해장국), 서울중앙시장 먹거리를 추천합니다. '맛집' 탭을 확인하세요."}},
 {k:/food|eat|restaurant|dinner|lunch|bbq|맛집|식당|저녁|점심|美食|餐厅|晚饭|ご飯|レストラン|焼肉/i, a:{en:"Top picks within 10 min: Gyeryugwan (roast chicken), Jikhwajangin (charcoal BBQ), BurgerBurger, Gungchae (bibimbap in the market), MoonMoon wine bar. Open the Eat tab — each has a QR to Google Maps.",zh:"步行10分钟内推荐：桂流馆（烤鸡）、直火匠人（炭火烤肉）、BurgerBurger、宫彩（市场拌饭）、MoonMoon葡萄酒吧。详见「美食」页二维码。",ja:"徒歩10分圏内のおすすめ：桂流館（ローストチキン）、直火匠人（炭火焼肉）、バーガー、宮彩（市場のビビンバ）、MoonMoon（ワインバー）。「グルメ」タブのQRから地図へ。",ko:"도보 10분 내 추천: 계류관(통닭), 직화장인(숯불고기), 벅벅(버거), 궁채(시장 비빔밥), 문문(와인바). '맛집' 탭 QR로 지도가 열립니다."}},
 {k:/subway|station|metro|direction|how.*get|길|역|지하철|地铁|站|駅|行き方/i, a:{en:"Nearest stations: Sindang (Line 2·6) and Dongmyo (Line 1·6), both about 8 min on foot. See the Getting here tab for step-by-step routes and a Google/Naver map button.",zh:"最近地铁站：新堂站（2·6号线）、东庙站（1·6号线），步行约8分钟。详见「交通」页。",ja:"最寄り駅：新堂駅（2・6号線）、東廟前駅（1・6号線）、徒歩約8分。「アクセス」タブをご覧ください。",ko:"가까운 역: 신당역(2·6호선), 동묘앞역(1·6호선), 도보 약 8분. '오시는 길' 탭에 길 안내와 지도 버튼이 있습니다."}},
 {k:/taxi|택시|出租|タクシー/i, a:{en:"Show the driver: 서울 중구 난계로17길 58-13 (Home tab → 'Show address to taxi driver'). Kakao T app works for foreign cards too.",zh:"请向司机出示：서울 중구 난계로17길 58-13（首页→出示给司机）。Kakao T 应用也支持外国卡。",ja:"運転手に「서울 중구 난계로17길 58-13」を見せてください（ホーム→タクシー運転手に見せる）。",ko:"기사님께 '서울 중구 난계로17길 58-13'을 보여주세요 (홈 → 택시 기사님께 보여주기)."}},
 {k:/park|car|주차|停车|駐車/i, a:{en:"There is only 1 parking space. Please contact the front desk in advance.",zh:"仅有1个车位，请提前联系前台。",ja:"駐車場は1台のみです。事前にフロントへご連絡ください。",ko:"주차는 1대만 가능하니 사전에 프런트에 문의해 주세요."}},
 {k:/smok|cigar|담배|흡연|吸烟|抽烟|タバコ|喫煙/i, a:{en:"The whole building is non-smoking (a cleaning fee applies). Please smoke outdoors away from the entrance.",zh:"全楼禁烟（违者收取清洁费），请在户外远离入口处吸烟。",ja:"館内は全面禁煙です（違反時は清掃料）。屋外の入口から離れた場所でお願いします。",ko:"건물 전체 금연입니다(위반 시 청소비 부과). 입구에서 떨어진 실외에서 흡연해 주세요."}},
 {k:/emergenc|hospital|police|sick|doctor|응급|병원|경찰|急|医院|警察|病院|救急/i, a:{en:"Emergency: 112 police · 119 fire/ambulance · 1330 Korea Travel Hotline (English/中文/日本語, 24h). Then please tell the front desk: "+CFG.phone,zh:"紧急情况：112 警察 · 119 消防/急救 · 1330 旅游热线（中文24小时）。并请联系前台："+CFG.phone,ja:"緊急時：112 警察 · 119 消防/救急 · 1330 観光ホットライン（日本語24時間）。フロント："+CFG.phone,ko:"긴급: 112 경찰 · 119 소방/구급 · 1330 관광통역안내. 프런트: "+CFG.phone}},
 {k:/shop|market|dongmyo|vintage|dongdaemun|ddp|쇼핑|시장|购物|市场|買い物|市場/i, a:{en:"Nearby: Seoul Central Market (5 min, street food), Dongmyo Vintage Market (8 min), Cheonggyecheon stream walk (5 min), DDP & Dongdaemun night shopping (15 min walk).",zh:"周边：首尔中央市场（5分钟）、东庙古着市场（8分钟）、清溪川（5分钟）、DDP·东大门夜市（步行15分钟）。",ja:"周辺：ソウル中央市場（5分）、東廟古着市場（8分）、清渓川（5分）、DDP・東大門（徒歩15分）。",ko:"주변: 서울중앙시장(5분), 동묘 구제시장(8분), 청계천(5분), DDP·동대문(도보 15분)."}}
];
const FAQ_MISS={en:"I don't have that answer here. Please contact the front desk: "+CFG.phone+" (or Korea Travel Hotline 1330, 24h).",zh:"这个问题我暂时无法回答，请联系前台："+CFG.phone+"（或旅游热线1330）。",ja:"申し訳ありません、その質問にはお答えできません。フロント："+CFG.phone+"（観光ホットライン1330）までお問い合わせください。",ko:"그 질문은 여기서 답변드리기 어렵습니다. 프런트("+CFG.phone+") 또는 관광통역안내 1330으로 문의해 주세요."};
function detectLang(q){ if(/[\u3040-\u30ff]/.test(q))return "ja"; if(/[\uac00-\ud7a3]/.test(q))return "ko"; if(/[\u4e00-\u9fff]/.test(q))return "zh"; return L; }
function faqAnswer(q){const lg=detectLang(q);const hit=FAQ.find(f=>f.k.test(q));return (hit?hit.a:FAQ_MISS)[lg]||(hit?hit.a:FAQ_MISS).en;}

function renderAI(){
  const t=T[L];
  if(!aiMsgs.length) aiMsgs=[{role:"assistant",content:({en:"Hi! I'm the BRIDGE concierge. Ask me about check-in, luggage, Wi-Fi, directions, food or emergencies.",zh:"您好！我是BRIDGE礼宾。可以问我入住、行李、Wi-Fi、交通、美食或紧急情况。",ja:"こんにちは！BRIDGEコンシェルジュです。チェックイン・荷物・Wi-Fi・アクセス・グルメ・緊急時などお気軽に。",ko:"안녕하세요! BRIDGE 컨시어지입니다. 체크인·짐·와이파이·길찾기·맛집·긴급상황 무엇이든 물어보세요."})[L]}];
  $("#v-ai").innerHTML=`
  <h1>${esc(t.aiTitle)}</h1><p class="mute">${esc(t.aiSub)}</p>
  <div class="card"><div class="chat" id="chat">${aiMsgs.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("")}</div>
   <div class="row" id="sugg" style="margin-top:8px">${t.sugg.map(s=>`<button class="btn sm ghost">${esc(s)}</button>`).join("")}</div>
   <form class="inrow" id="aiForm"><input id="aiIn" placeholder="${esc(t.aiPh)}" autocomplete="off"><button class="btn" type="submit">${esc(t.send)}</button></form>
  </div>
  <p class="note">Emergency 112 (police) · 119 (fire/ambulance) · 1330 Korea Travel Hotline (EN/中文/日本語)</p>`;
  $("#aiForm").onsubmit=e=>{e.preventDefault();ask($("#aiIn").value)};
  $("#sugg").querySelectorAll("button").forEach(b=>b.onclick=()=>ask(b.textContent));
  const c=$("#chat");c.scrollTop=c.scrollHeight;
}
function ask(q){q=(q||"").trim();if(!q)return;aiMsgs.push({role:"user",content:q});aiMsgs.push({role:"assistant",content:faqAnswer(q)});renderAI();setTimeout(()=>{const i=$("#aiIn");i&&i.focus()},50)}

/* ============ boot ============ */
function renderAll(){
  document.documentElement.lang=L==="zh"?"zh-CN":L;
  $("#langs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  renderTabs();renderHome();renderCheckin();renderRooms();renderArea();renderEat();renderAI();
  show((location.hash||"").slice(1)||"home");
}
$("#langs").querySelectorAll("button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("bridge_lang",L)}catch(e){}renderAll()});
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
window.addEventListener("hashchange",()=>show((location.hash||"").slice(1)||"home"));
renderAll();

</script>
