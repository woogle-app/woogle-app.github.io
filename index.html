<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B3D9FB">
<link rel="icon" href="woogle-logo.png">
<link rel="apple-touch-icon" href="woogle-logo.png">
<title>우글우글</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/HakgyoansimDunggeunmiso/subsets/HakgyoansimDunggeunmiso-dynamic-subset.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: 데스크톱에서도 폭 440px 모바일 화면 하나만 가운데 띄우고, 그 안을 지역색으로 100% 채운 뒤 흰 카드를 올리는 구조 */
:root{
  --orange:#FB7201; --orange-2:#FB9600; --yellow:#FCCB01; --blue:#01A1FB; --blue-deep:#0060EA;
  --pink:#FC9EC9; --pink-deep:#E64C93; --cream:#FFE7D4; --white:#FFFFFF; --ink:#2A1A0C; --ink-soft:#6B5442;
  --line:#F1E2D3; --danger:#E5361F;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-card:22px; --r-pill:999px;
  --bg:var(--orange); --on-bg:var(--white); --strong:var(--orange);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.6;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.app{max-width:440px;min-height:100%;margin:0 auto;background:var(--bg);color:var(--on-bg);position:relative;box-shadow:0 0 0 1px rgba(42,26,12,.06),0 20px 60px rgba(42,26,12,.18);transition:background .25s}
.region-guri{--bg:var(--blue);--on-bg:var(--white);--strong:var(--blue-deep)}
.region-nam{--bg:var(--yellow);--on-bg:var(--ink);--strong:var(--orange)}
.region-jin{--bg:var(--pink);--on-bg:var(--ink);--strong:var(--pink-deep)}
.region-home{--bg:var(--orange);--on-bg:var(--white);--strong:var(--orange)}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 헤더 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;transition:background .25s}
.brand{margin:0;line-height:0}
.brand img{height:58px;width:auto;display:block}
.brand button{all:unset;cursor:pointer}
.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;background:transparent;display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px}
.bell .dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:var(--white);font-size:13px;line-height:20px;text-align:center;font-family:var(--font)}
.me{border:0;background:var(--white);color:var(--ink);border-radius:var(--r-pill);padding:7px 14px;font-weight:800;font-size:18px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .adm{font-size:12px;background:var(--orange);color:var(--white);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:2px;font-weight:700}

.banner{margin:4px 0 0;background:var(--white);color:var(--ink);border-radius:14px;padding:9px 14px;font-size:14.5px;line-height:1.4}

/* 지역 탭 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:6px 4px}
.tab{border:2.5px solid var(--white);background:transparent;color:var(--on-bg);border-radius:16px;padding:12px 4px;font-size:20px;font-weight:700;min-height:52px;transition:transform .15s}
.region-nam .tab,.region-jin .tab{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--white);color:var(--ink);border-color:var(--white);box-shadow:0 4px 0 rgba(42,26,12,.18)}
.region-nam .tab[aria-selected="true"],.region-jin .tab[aria-selected="true"]{border-color:var(--ink)}
.tab .dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1.5px solid var(--ink);vertical-align:1px}

/* CTA */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:22px 18px}
.hero p{margin:0;font-size:19px;font-weight:500;opacity:.95}
.cta{border:3px solid var(--ink);background:var(--white);color:var(--ink);border-radius:var(--r-pill);padding:15px 30px;font-size:23px;font-weight:800;box-shadow:0 5px 0 var(--ink);display:inline-flex;align-items:center;gap:10px;transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cta svg{width:24px;height:24px;color:var(--strong)}
.cta[disabled]{opacity:.55;cursor:not-allowed}

/* 리스트 */
.list-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 8px}
.list-head h2{margin:0;font-size:23px;font-weight:800}
.list-head h2 small{font-size:18px;font-weight:700;opacity:.85;margin-left:4px}
.seg{display:inline-flex;background:rgba(255,255,255,.28);border-radius:var(--r-pill);padding:3px;gap:2px}
.region-nam .seg,.region-jin .seg{background:rgba(42,26,12,.1)}
.seg button{border:0;background:transparent;color:var(--on-bg);border-radius:var(--r-pill);padding:8px 14px;font-size:17px;font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid currentColor;background:transparent;color:var(--on-bg);border-radius:var(--r-pill);padding:8px 15px;font-size:17px;font-weight:600;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:14px;padding-bottom:40px}

.card{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 rgba(42,26,12,.12);min-width:0}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:15px;font-weight:600;line-height:1;padding:6px 9px;border-radius:8px;background:var(--cream);color:var(--ink)}
.badge.rg-guri{background:var(--blue);color:var(--white)}
.badge.rg-nam{background:var(--yellow)}
.badge.rg-jin{background:var(--pink)}
.badge.ex{background:var(--ink);color:var(--white)}
.tools{display:flex;gap:2px;flex:none}
.icon-btn{width:32px;height:32px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft)}
.icon-btn:hover{background:var(--cream);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.del:hover{color:var(--danger)}
.card h3{margin:2px 0 0;font-size:25px;font-weight:800;line-height:1.25;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.meta{font-size:16.5px;color:var(--ink-soft)}
.meta b{color:var(--ink);font-weight:700}
.body{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:20px;line-height:1.65}
.body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:10px;border-top:2px dashed var(--line)}
.heart{position:relative;width:46px;height:46px;border:0;background:transparent;padding:0;display:grid;place-items:center;flex:none}
.heart svg{width:34px;height:34px;overflow:visible}
.heart path{fill:var(--white);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;transition:fill .2s}
.heart.on path{fill:var(--orange)}
.heart[disabled]{cursor:default}
.heart.pop svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.7)}65%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;margin:-3.5px;animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.with{flex:1;min-width:0;font-size:18px}
.with b{font-weight:800;color:var(--orange);font-size:22px}
.cmt-btn{border:2px solid var(--ink);background:var(--white);border-radius:var(--r-pill);padding:8px 14px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:5px;flex:none;min-height:44px}
.cmt-btn svg{width:16px;height:16px}

.empty{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:28px 20px;text-align:center;font-size:19px}
.empty strong{display:block;font-size:22px;font-weight:800;margin-bottom:4px}

/* 로그인 */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:40px}
.login .logo{margin:0;line-height:0}
.login .logo img{width:min(62%,250px);height:auto;display:block}
.login p.lead{margin:0;color:var(--white);font-size:21px;font-weight:600;line-height:1.5}
.login form{background:var(--white);color:var(--ink);border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgba(42,26,12,.2)}
.login label{font-size:21px;font-weight:700}
.login .hint{font-size:16.5px;color:var(--ink-soft);margin:0}
.login .dots{display:flex;gap:8px}
.login .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.field{width:100%;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:16px;padding:13px 14px;font-size:20px;background:var(--white)}
.field:focus{outline:none;box-shadow:0 0 0 4px var(--yellow)}
.btn{border:3px solid var(--ink);background:var(--orange);color:var(--white);border-radius:var(--r-pill);padding:13px 20px;font-size:21px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--ink)}
.err{color:var(--danger);font-size:17px;margin:0;min-height:1em}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(42,26,12,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:440px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--white);color:var(--ink);border-radius:26px 26px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sheet-head h2{margin:0;font-size:24px;font-weight:800}
.x{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--white);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.form{display:flex;flex-direction:column;gap:16px}
.form .lbl{font-size:19px;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.form .lbl small{color:var(--ink-soft);font-size:15.5px;font-weight:500}
.rg-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rg-pick button{border:2.5px solid var(--ink);border-radius:14px;padding:14px 4px;font-size:19px;font-weight:700;background:var(--white)}
.rg-pick button[aria-pressed="true"].g{background:var(--blue);color:var(--white)}
.rg-pick button[aria-pressed="true"].n{background:var(--yellow)}
.rg-pick button[aria-pressed="true"].j{background:var(--pink)}
.cat-pick{display:flex;flex-wrap:wrap;gap:7px}
.cat-pick button{border:2px solid var(--ink);border-radius:var(--r-pill);padding:9px 16px;font-size:18px;font-weight:600;background:var(--white)}
.cat-pick button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
textarea.field{min-height:180px;resize:vertical;line-height:1.6;font-size:20px}
.preview{background:var(--cream);border-radius:14px;padding:10px 14px;font-size:20px;font-weight:700}
.preview small{display:block;font-size:15px;font-weight:500;color:var(--ink-soft)}

/* 상세 + 댓글 */
.detail-post{border-left:6px solid var(--strong);padding-left:12px;margin-bottom:6px}
.cmts{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.cmts h3{margin:0 0 6px;font-size:21px;font-weight:800}
.cmt{padding:10px 0;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.cmt-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmt-top .meta{min-width:0}
.cmt p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:19px}
.cmt .edit-row{display:flex;gap:6px;justify-content:flex-end}
.cmt .edit-row button{border:2px solid var(--ink);border-radius:var(--r-pill);background:var(--white);padding:3px 12px;font-size:15px}
.cmt .edit-row button.save{background:var(--ink);color:var(--white)}
.cmt-form{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--white);padding-block:8px 0}
.cmt-form input{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:var(--r-pill);padding:12px 16px;font-size:19px}
.cmt-form input:focus{outline:none;box-shadow:0 0 0 4px var(--yellow)}
.cmt-form button{border:0;background:var(--orange);color:var(--white);border-radius:var(--r-pill);padding:0 18px;font-size:19px;font-weight:700;flex:none}
.no-cmt{color:var(--ink-soft);font-size:18px;padding:10px 0}

/* 알림 */
.noti{display:flex;flex-direction:column}
.noti button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-top:2px dashed var(--line)}
.noti .ic{width:30px;height:30px;border-radius:50%;background:var(--cream);display:grid;place-items:center;flex:none}
.noti .ic svg{width:17px;height:17px}
.noti .new .ic{background:var(--orange);color:var(--white)}
.noti .t{font-size:18px;line-height:1.4}
.noti .t small{display:block;color:var(--ink-soft);font-size:15px}

/* 마이페이지 */
.back{border:2px solid currentColor;background:transparent;color:var(--on-bg);border-radius:var(--r-pill);padding:8px 14px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.profile{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:10px;margin-block:8px 14px;box-shadow:0 4px 0 rgba(42,26,12,.18)}
.profile .name{font-size:30px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.profile .name .adm{font-size:15px;font-weight:700;background:var(--orange);color:var(--white);border-radius:8px;padding:2px 8px;vertical-align:5px;margin-left:6px}
.belong{font-size:18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.belong .none{background:var(--cream);border-radius:10px;padding:8px 12px;font-size:17px;font-weight:600}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pstats div{background:var(--cream);border-radius:14px;padding:10px 12px}
.pstats b{display:block;font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.pstats span{font-size:16px;color:var(--ink-soft)}
.mtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.mtabs button{flex:none;border:2.5px solid var(--white);background:transparent;color:var(--white);border-radius:var(--r-pill);padding:9px 16px;font-size:18px;font-weight:700}
.mtabs button[aria-selected="true"]{background:var(--white);color:var(--ink)}
.linkish{border:0;background:transparent;color:var(--on-bg);text-decoration:underline;text-underline-offset:3px;font-size:15px;padding:6px 0;align-self:center;font-size:17px}

/* 대시보드 */
.dash{display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.panel{background:var(--white);color:var(--ink);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{margin:0;font-size:21px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 small{font-size:15px;font-weight:500;color:var(--ink-soft)}
.dseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.3);padding:4px;border-radius:16px}
.dseg button{border:0;background:transparent;color:var(--white);border-radius:12px;padding:10px 2px;font-size:17px;font-weight:700}
.dseg button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border-radius:16px;padding:12px 10px;background:var(--cream);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:15px;color:var(--ink-soft);line-height:1.3}
.kpi.k1{background:var(--blue);color:var(--white)}.kpi.k1 span{color:rgba(255,255,255,.9)}
.kpi.k2{background:var(--yellow)}
.kpi.k3{background:var(--pink)}
.kpi.k2 span,.kpi.k3 span{color:var(--ink)}
.note{font-size:16px;color:var(--ink-soft);margin:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:17px}
th,td{padding:8px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:700;color:var(--ink-soft);font-size:15px;border-bottom:2px solid var(--ink)}
tbody tr+tr td{border-top:1.5px dashed var(--line)}
tfoot td{border-top:2px solid var(--ink)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:84px 1fr 72px;align-items:center;gap:8px;font-size:17px}
.bar-track{height:18px;background:var(--cream);border-radius:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:9px;background:var(--orange);min-width:2px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-size:15.5px}
.log{display:flex;flex-direction:column}
.log-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1.5px dashed var(--line)}
.log-item:first-child{border-top:0}
.log-item .txt{flex:1;min-width:0;font-size:17px;line-height:1.4}
.log-item .txt small{display:block;color:var(--ink-soft);font-size:15px}
.log-item .kind{font-size:12px;background:var(--ink);color:var(--white);border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.restore{border:2px solid var(--ink);background:var(--yellow);border-radius:var(--r-pill);padding:8px 14px;font-size:16px;font-weight:700;flex:none}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:var(--r-pill);font-size:18px;z-index:80;max-width:calc(100% - 40px);text-align:center;animation:up .25s}

.loading{padding-block:80px;text-align:center;font-size:21px}

/* 우글우글 포스터를 앱 전체 배경으로 */
:root{--sky:#B3D9FB}
body::before{background:var(--sky)}
.app{background:var(--sky);color:var(--ink);--on-bg:var(--ink)}

/* ===== 가을 테마 (심플) ===== */
:root{--cream:#FBF3E6;--paper:#FFFDF8;--maple:#D2602A;--maple-d:#A9461C;--mustard:#E2A33A;--brick:#A94435;--ink:#3A281B;--ink-soft:#7A6452;--line:#EEDFC9;--orange:#D2602A;--sky:#FBF3E6}

.app,.app.region-guri,.app.region-nam,.app.region-jin,.app.region-home{background:var(--cream);--bg:var(--cream);--on-bg:var(--ink);color:var(--ink);box-shadow:0 0 40px rgba(58,40,27,.08)}

.tab[aria-selected="true"]{box-shadow:none;border-color:transparent;color:#FFFDF8}

.region-jin .tab[aria-selected="true"]{background:#A94435;color:#FFFDF8}

.list-head h2{background:none;padding:0}

.badge.ex{background:var(--ink-soft);color:#FFFDF8}
.cmt-btn{border:1.5px solid var(--line);background:var(--paper)}
.heart.on path{fill:var(--maple)}
.with b{color:var(--maple)}
.btn{background:var(--maple);border:0;box-shadow:0 3px 0 var(--maple-d);color:#FFFDF8}
.btn:active{box-shadow:0 1px 0 var(--maple-d)}
.field{border:1.5px solid #DCC8AE;border-radius:14px;background:var(--paper)}

.empty{background:var(--paper);border:1px dashed #DCC8AE}
.back,.linkish{background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.mtabs button{background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.mtabs button[aria-selected="true"]{background:var(--maple);border-color:var(--maple);color:#FFFDF8}
.dseg{background:#F1E3CE}
.dseg button{color:var(--ink-soft)}
.dseg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.profile{background:var(--paper);border:1px solid var(--line);box-shadow:none}
.profile .name .adm,.me .adm{background:var(--maple)}
.pstats div,.kpi{background:#F5E8D4}
.panel{background:var(--paper);border:1px solid var(--line)}
.kpi.k1{background:#D2602A;color:#FFFDF8}.kpi.k1 span{color:#FFE9D6}
.kpi.k2{background:#E2A33A}
.kpi.k3{background:#A94435;color:#FFFDF8}.kpi.k3 span{color:#F6DCD5}
.bar-track{background:#F1E3CE}.bar-fill{background:var(--maple)}

.rg-pick button{border:1.5px solid #DCC8AE}
.rg-pick button[aria-pressed="true"].g{background:#D2602A;color:#FFFDF8;border-color:#D2602A}
.rg-pick button[aria-pressed="true"].n{background:#E2A33A;border-color:#E2A33A}
.rg-pick button[aria-pressed="true"].j{background:#A94435;color:#FFFDF8;border-color:#A94435}
.cat-pick button{border:1.5px solid #DCC8AE}
.cat-pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.preview{background:#F5E8D4}
.sheet{background:var(--paper)}
.cmt-form{background:var(--paper)}
.cmt-form input{border:1.5px solid #DCC8AE}

.x{border:1.5px solid var(--line);background:var(--paper)}
.crowd{max-width:440px;margin:6px auto 0}
/* 첫 화면 */
.login{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px!important;padding:44px 0 0!important;background:var(--cream)!important;overflow:hidden}
.lg-title{margin:0;line-height:0}
.lg-logo{width:min(56%,220px);height:auto;display:block;margin:0 auto}

.lg-form{width:min(86%,370px);display:flex;flex-direction:column;gap:10px!important;background:var(--paper)!important;border:1px solid var(--line);border-radius:20px;padding:18px!important;box-shadow:0 8px 20px rgba(58,40,27,.08)!important;margin-top:6px;position:relative;z-index:1}

.lg-form .field{text-align:center;font-size:20px}

.leaf{position:absolute;pointer-events:none;opacity:.9}

/* 앞줄 문어 3마리 */
.login{justify-content:center!important;padding:24px 0 0!important}
.login .trio{margin-top:18px}
.trio{display:flex;justify-content:center;align-items:flex-end;width:100%;max-width:440px;margin:auto auto 0;padding:0 10px 14px;position:relative;z-index:1}
.trio .o{display:block;height:auto}
.trio .o1{width:31%;transform:rotate(-7deg) translateY(-6px);margin-right:-3%}
.trio .o2{width:37%;position:relative;z-index:2}

async function loadColl(c){
  const {data,error}=await store.sb.from(c).select("*").limit(5000);
  if(error){console.warn(c,error);return}
  const m=new Map();data.forEach(r=>m.set(r.id,Object.assign({id:r.id},MAP[c].from(r))));S[c]=m;schedule();
}
async function initStore(){
  store.mode="db";
  store.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
  await Promise.all(COLLS.map(loadColl));
  const timers={};
  store.sb.channel("woogle").on("postgres_changes",{event:"*",schema:"public"},p=>{const t=p.table;if(!COLLS.includes(t))return;clearTimeout(timers[t]);timers[t]=setTimeout(()=>loadColl(t),250)}).subscribe();
  setInterval(()=>{if(!document.hidden)COLLS.forEach(loadColl)},20000);
}
function writeErr(e){console.warn(e);toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");}
async function put(coll,id,data){
  const row=Object.assign({id},MAP[coll].to(data));
  S[coll].set(id,Object.assign({id},data));schedule();
  const {error}=await store.sb.from(coll).upsert(row);
  if(error){writeErr(error);loadColl(coll);throw error}
}
async function patch(coll,id,p){
  const cur=S[coll].get(id);if(!cur)return;
  const next=Object.assign({},cur,p);delete next.id;
  await put(coll,id,next);
}

/* ---------- 대시보드 ---------- */
function stats(rk){
  const inR=p=>rk==="all"||p.region===rk;
  const posts=livePosts().filter(inR), ids=new Set(posts.map(p=>p.id));
  const likes=[...S.likes.values()].filter(l=>ids.has(l.postId));
  const users=[...S.users.values()];
  return {
    users:rk==="all"?users.length:new Set(posts.map(p=>p.authorHx)).size,
    posts:posts.length,
    people:new Set(likes.map(l=>l.nickHx)).size,
    likes:likes.length,
    cats:CATS.map(c=>{const ps=posts.filter(p=>(p.cats||[]).includes(c));const pid=new Set(ps.map(p=>p.id));const lk=likes.filter(l=>pid.has(l.postId));
      return {c,posts:ps.length,writers:new Set(ps.map(p=>p.authorHx)).size,people:new Set(lk.map(l=>l.nickHx)).size};})
  };
}

/* ---------- 알림 ---------- */
function notiList(){
  if(!st.nick)return [];
  const seen=ls.get("woogle.seen."+me().hx,0), mine=new Map(livePosts().filter(p=>p.authorHx===me().hx).map(p=>[p.id,p])), out=[];
  S.likes.forEach(l=>{const p=mine.get(l.postId);if(p&&l.nickHx!==me().hx)out.push({k:"like",at:l.createdAt,p,isNew:l.createdAt>seen})});
  S.comments.forEach(c=>{const p=mine.get(c.postId);if(p&&!c.deleted&&c.authorHx!==me().hx)out.push({k:"cmt",at:c.createdAt,p,c,isNew:c.createdAt>seen})});
  return out.sort((a,b)=>b.at-a.at).slice(0,30);
}

/* ---------- 동작 ---------- */
async function login(nick){
  st.nick=nick;ls.set("woogle.nick",nick);
  const hx=hex(nick);
  if(!S.users.has(hx)){try{await put("users",hx,{nick,region:null,createdAt:now()})}catch(e){}}
  st.view="main";render();
}
async function submitWrite(){
  const s=st.sheet,d=s.draft,err=$("#w-err");const t=d.target.trim(),b=d.body.trim();
  if(!t){err.textContent=BD[d.region].terr;$("#w-target").focus();return}
  if(d.region==="guri"&&!d.cats.size){err.textContent="어떤 기원인지 하나 이상 골라 주세요.";return}
  if(b.length<2){err.textContent="내용을 적어 주세요.";$("#w-body").focus();return}
  const btn=$("#w-submit");btn.disabled=true;
  try{
    let photo=d.region==="guri"?null:(d.photo||null);
    if(d.region!=="guri"&&d.photoBlob){
      btn.textContent="사진 올리는 중…";
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up=await store.sb.storage.from("photos").upload(path,d.photoBlob,{contentType:"image/jpeg",upsert:false});
      if(up.error){toast("사진을 올리지 못했어요. 다시 시도해 주세요.");throw up.error}
      photo=store.sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
    }
    if(s.id){await patch("posts",s.id,{target:t,body:b,cats:d.region==="guri"?[...d.cats]:[],region:d.region,photo,editedAt:now()});toast("글을 고쳤어요.");}
    else{
      const id=mkId();
      await put("posts",id,{target:t,body:b,cats:d.region==="guri"?[...d.cats]:[],region:d.region,photo,author:st.nick,authorHx:me().hx,createdAt:now(),deleted:false});
      const u=myUser();
      if(!u)await put("users",me().hx,{nick:st.nick,region:d.region,createdAt:now()});
      else if(!u.region)await patch("users",me().hx,{region:d.region});
      st.region=d.region;ls.set("woogle.region",d.region);st.sort="new";st.cats.clear();
      toast("글을 올렸어요.");
    }
    closeSheet();if(!s.id){st.view="main";window.scrollTo({top:0});}render();
  }catch(e){btn.disabled=false;btn.textContent=BD[d.region].submit;}
}
async function like(id){
  if(liked(id))return;const p=S.posts.get(id);if(!p)return;
  const key=id+"_"+me().hx;
  st.justLiked=id;
  try{await put("likes",key,{postId:id,nickHx:me().hx,region:p.region,createdAt:now()});}catch(e){st.justLiked=null;}
  schedule();
}
async function softDelete(coll,id){
  try{await patch(coll,id,{deleted:true,deletedAt:now(),deletedBy:st.nick});toast(coll==="posts"?"기원문을 삭제했어요.":"댓글을 삭제했어요.");}catch(e){}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==="scrim"){if(e.target===t)closeSheet();return}
  switch(a){
    case "home":closeSheet();st.view="main";render();window.scrollTo({top:0});break;
    case "my":closeSheet();st.view="my";render();window.scrollTo({top:0});break;
    case "region":st.region=t.dataset.r;ls.set("woogle.region",st.region);render();break;
    case "sort":st.sort=t.dataset.s;render();break;
    case "cat":{const c=t.dataset.c;st.cats.has(c)?st.cats.delete(c):st.cats.add(c);render();break}
    case "catclear":st.cats.clear();render();break;
    case "expand":st.expanded.add(id);render();break;
    case "write":if(!store.canWrite){toast("보기 전용이라 지금은 쓸 수 없어요.");break}openSheet({type:"write"});setTimeout(()=>{const x=$("#w-target");if(x)x.focus()},250);break;
    case "edit":openSheet({type:"write",id});break;
    case "close":closeSheet();break;
    case "wphoto-del":{const d=st.sheet.draft;const tv=$("#w-target"),bv=$("#w-body");if(tv)d.target=tv.value;if(bv)d.body=bv.value;d.photo=null;d.photoBlob=null;d.photoPreview=null;drawSheet();break}
    case "wreg":{const dr=st.sheet.draft;const tv=$("#w-target"),bv=$("#w-body");if(tv)dr.target=tv.value;if(bv)dr.body=bv.value;dr.region=t.dataset.r;drawSheet();break}
    case "wcat":{const d=st.sheet.draft,c=t.dataset.c;d.cats.has(c)?d.cats.delete(c):d.cats.add(c);t.setAttribute("aria-pressed",d.cats.has(c));$("#w-err").textContent="";break}
    case "like":await like(id);break;
    case "open":openSheet({type:"detail",id});break;
    case "delpost":await softDelete("posts",id);break;
    case "cdel":await softDelete("comments",id);break;
    case "cedit":st.editingCmt=id;{const c=$("#d-cmts");if(c)c.innerHTML=cmtsHTML(st.sheet.id);const i=$("#cedit-in");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}break;
    case "ccancel":st.editingCmt=null;refreshSheet();break;
    case "csave":{const v=($("#cedit-in").value||"").trim();if(!v){toast("댓글 내용을 적어 주세요.");break}try{await patch("comments",id,{body:v,editedAt:now()});st.editingCmt=null;refreshSheet();toast("댓글을 고쳤어요.")}catch(err){}break}
    case "noti":openSheet({type:"noti"});ls.set("woogle.seen."+me().hx,now());schedule();break;
    case "mtab":st.mtab=t.dataset.t;render();break;
    case "dreg":st.dRegion=t.dataset.r;render();break;
    case "restore":try{await patch(t.dataset.type==="post"?"posts":"comments",id,{deleted:false,restoredAt:now(),restoredBy:st.nick});toast("복구했어요.")}catch(err){}break;
    case "startlogin":{const w=$("#start-wrap");if(w)w.hidden=true;const f=$("#nick-form");if(f){f.hidden=false;const i=$("#nick-in");if(i)i.focus();}break}
    case "logout":ls.set("woogle.nick","");st.nick="";st.view="login";closeSheet();$("#view").innerHTML="";render();break;
  }
});
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const m=1280,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
  }finally{URL.revokeObjectURL(url)}
}
document.addEventListener("change",async e=>{
  if(e.target.id!=="w-photo"||!st.sheet||st.sheet.type!=="write")return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast("사진 파일만 올릴 수 있어요.");return}
  const d=st.sheet.draft;const tv=$("#w-target"),bv=$("#w-body");if(tv)d.target=tv.value;if(bv)d.body=bv.value;
  try{d.photoBlob=await shrink(f);d.photoPreview=URL.createObjectURL(d.photoBlob);drawSheet();}catch(err){toast("사진을 읽지 못했어요. 다른 사진을 골라 주세요.")}
});
document.addEventListener("input",e=>{
  const s=st.sheet;if(!s||s.type!=="write")return;
  if(e.target.id==="w-target"){s.draft.target=e.target.value;updateWritePreview();$("#w-err").textContent=""}
  if(e.target.id==="w-body"){s.draft.body=e.target.value;updateWritePreview();$("#w-err").textContent=""}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="nick-form"){
    const v=($("#nick-in").value||"").trim().replace(/\s+/g," ");const er=$("#nick-err");
    if(v.length<2){er.textContent="닉네임을 2자 이상 적어 주세요.";return}
    if(v.length>NICK_MAX){er.textContent=`닉네임은 ${NICK_MAX}자까지 쓸 수 있어요.`;return}
    $("#nick-go").disabled=true;await login(v);
  }else if(e.target.id==="write-form"){await submitWrite();}
  else if(e.target.id==="cmt-form"){
    const inp=$("#cmt-in"),v=(inp.value||"").trim();if(!v)return;
    const pid=st.sheet.id;
    try{await put("comments",mkId(),{postId:pid,body:v,author:st.nick,authorHx:me().hx,createdAt:now(),deleted:false});inp.value="";refreshSheet();schedule();}catch(err){}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&st.sheet)closeSheet();});
setInterval(()=>{if(st.view!=="login")schedule()},60000);

/* ---------- 시작 ---------- */
(async()=>{
  await initStore();
  if(!RG[st.region])st.region="guri";
  if(st.nick){st.view="main";const hx=hex(st.nick);if(!S.users.has(hx)){try{await put("users",hx,{nick:st.nick,region:null,createdAt:now()})}catch(e){}}}
  else{st.view="login";$("#view").innerHTML="";}
  render();
})();
})();
</script>
