 $("#v-eat").innerHTML=`<h1>${esc(t.eatT)}</h1><p class="mute">${esc(t.eatP)}</p><div class="filters">${["all","korean","bbq"].map(c=>`<button data-c="${c}" class="${c===cat?"on":""}">${esc(c==="all"?t.all:t.cats[c])}</button>`).join("")}</div>
 ${list.map(e=>`<div class="card eat"><div><h3>${esc(e.n)}</h3><div class="small" style="font-weight:600">★ ${e.r} · ${e.m}${esc(t.away)} · ${walkMin(e.m)} ${esc(t.walk)}</div><p class="small mute" style="margin:3px 0">${esc(e.d[L])}</p><div class="small mute">🕒 ${esc(e.h)} · <a href="${gmapsPlace(e)}" target="_blank" rel="noopener">Map ↗</a></div></div><div class="q" data-i="${e.ix}"></div></div>`).join("")}
 <p class="note">Ratings & hours: Google Maps, Nov 2026.</p>`;
 $("#v-eat").querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderEat()});
 $("#v-eat").querySelectorAll(".q").forEach(q=>{const e=EAT[+q.dataset.i];qr(q,gmapsPlace(e),150);q.onclick=()=>showQR(e.n,gmapsPlace(e))})}
let msgs=[];
function renderAI(){const t=T[L];if(!msgs.length)msgs=[{u:0,c:t.hi}];
 $("#v-ai").innerHTML=`<h1>${esc(t.aiT)}</h1><p class="mute">${esc(t.aiP)}</p><div class="card"><div class="chat" id="chat">${msgs.map(m=>`<div class="msg ${m.u?"u":"a"}">${esc(m.c)}</div>`).join("")}</div>
 <div class="row" id="sugg" style="margin-top:8px">${t.sugg.map(s=>`<button class="btn sm ghost">${esc(s)}</button>`).join("")}</div>
 <form class="inrow" id="f"><input id="q" placeholder="${esc(t.aiPh)}" autocomplete="off"><button class="btn">${esc(t.send)}</button></form></div>
 <p class="note">Emergency 112 · 119 · Korea Travel Hotline 1330 (24h)</p>`;
 $("#f").onsubmit=e=>{e.preventDefault();ask($("#q").value)};$("#sugg").querySelectorAll("button").forEach(b=>b.onclick=()=>ask(b.textContent));const c=$("#chat");c.scrollTop=c.scrollHeight}
function ask(q){q=(q||"").trim();if(!q)return;msgs.push({u:1,c:q},{u:0,c:faq(q)});renderAI()}
function renderAll(){document.documentElement.lang=L;$("#langs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));renderTabs();renderHome();renderRooms();renderCheckin();renderArea();renderEat();renderAI();show((location.hash||"").slice(1)||"home")}
$("#langs").querySelectorAll("button").forEach(b=>b.onclick=()=>{L=b.dataset.l;msgs=[];try{localStorage.setItem("line_lang",L)}catch(e){}renderAll()});
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};addEventListener("hashchange",()=>show((location.hash||"").slice(1)||"home"));
renderAll();
</script></body></html>
