name: fetchhostel4
on:
  push:
    paths: [".github/workflows/fetchhostel4.yml"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmpimg
          cat > ids.txt <<'EOT'
          83226 zzzip-guesthouse-in-hongdae
          85799 g-guest-house-itaewon-in-seoul
          330544 original-backpackers
          295727 jin-s-paradise
          273421 time-travelers-relax-guesthouse-seoul
          315314 jongno-stay
          80823 oyo-hostel-dongdaemun-1
          90373 inno-hostel-and-pub-lounge-hongdae
          58226 hongdae-birdsnest-hostel
          77529 oppa-hostel
          291004 seoul-forest-stay
          13831 hongdae-guesthouse
          98078 57-myeongdong-hostel
          290766 the-cube-hotel
          87668 yakorea-hostel-dongdaemun
          280198 hostel-haru
          74324 whitetail-backpacker-and-hostel
          279227 neo-seoul-guesthouse
          291800 oyo-rooftop-hostel
          317189 oyo-hostel-myeongdong-5
          275922 k-grand-hostel-dongdaemun-3
          EOT
          while read id slug; do
            curl -fsSL -A "Mozilla/5.0" "https://www.hostelworld.com/hostels/p/$id/$slug/" -o page.html || { echo "PAGEFAIL $id"; continue; }
            grep -oE "propertyimages/[0-9]+/$id/[A-Za-z0-9]+\.(jpg|JPG)" page.html | sort -u | head -12 > list.txt
            echo "$id $(wc -l < list.txt)"
            n=0
            while read p; do n=$((n+1)); curl -fsSL -A "Mozilla/5.0" -o "tmpimg/${id}_$n.jpg" "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/$p" || echo FAIL; done < list.txt
          done < ids.txt
          rm -f page.html list.txt ids.txt
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmpimg && git commit -m "hostel imgs4" && git push
