name: fetchscale3
on:
  push:
    paths: [".github/workflows/fetchscale3.yml"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > fx.py <<'EOT'
          import re,html,os,urllib.request
          UA={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 Mobile Safari/604.1'}
          def get(u,b=False):
              r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read()
              return r if b else r.decode('utf8','ignore')
          os.makedirs('tmpimg',exist_ok=True);log=open('tmpimg/manifest3.txt','w')
          P={'ark':'https://m.blog.naver.com/peanut_s_/224229607704','sot':'https://m.blog.naver.com/sxsxham/223285336727','gri':'https://m.blog.naver.com/PostView.naver?blogId=chochocho_o&logNo=223091463070&categoryNo=0&proxyReferer=&noTrackingCode=true'}
          for k,page in P.items():
              try:
                  h=get(page)
                  L=[(m.start(),html.unescape(m.group(0))) for m in re.finditer(r'https://mblogthumb-phinf\.pstatic\.net/[^"\'\\\s)<>]+',h)]
                  L=[x for x in L if 'blur' not in x[1] and 'f100' not in x[1] and 'profile' not in x[1].lower()]
                  pos=[m.start() for m in re.finditer('저울',h)]
                  log.write(f'{k} imgs={len(L)} scalepos={pos}\n')
                  seen=[]
                  for p in pos[:4]:
                      for _,u in sorted(L,key=lambda x:abs(x[0]-p))[:3]:
                          b=u.split('?')[0]
                          if b not in [s.split('?')[0] for s in seen]: seen.append(u)
                  for i,u in enumerate(seen[:8]):
                      u=re.sub(r'type=\w+','type=w800',u) if 'type=' in u else u+'?type=w800'
                      try:
                          d=get(u,True);open(f'tmpimg/{k}_{i+1}.jpg','wb').write(d);log.write(f'OK {k}_{i+1} {len(d)} {u}\n')
                      except Exception as e: log.write(f'FAIL {k}_{i+1} {e}\n')
              except Exception as e: log.write(f'PAGEFAIL {k} {e}\n')
          log.close()

          EOT
          python3 fx.py
          rm fx.py
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmpimg && git commit -m "scale imgs3" && git push
