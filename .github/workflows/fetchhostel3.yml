name: fetchhostel3
on:
  push:
    paths: [".github/workflows/fetchhostel3.yml"]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmpimg
          g() { curl -fsSL -A "Mozilla/5.0" -o "tmpimg/$1" "$2" || echo "FAIL $1"; }
          g db1.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/2/272618/49.jpg"
          g db2.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/2/272618/37.jpg"
          g db3.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/2/272618/32.jpg"
          g db4.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/2/272618/31.jpg"
          g db5.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/2/272618/33.jpg"
          g db6.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/2/272618/34.jpg"
          g db7.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/2/272618/36.jpg"
          g ya1.jpg "https://a.hwstatic.com/image/upload/f_auto,q_auto,t_30/propertyimages/8/87668/1.jpg"
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add tmpimg && git commit -m "hostel imgs3" && git push
